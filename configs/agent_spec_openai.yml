functions:
  current_datetime:
    _type: current_datetime

workflow:
  _type: agent_spec
  description: Agent Spec via LangGraph adapter (OpenAI)
  verbose: true
  max_history: 10
  llm_name: openai_placeholder
  tool_names: [current_datetime]
  agentspec_yaml: |
    agentspec_version: 25.4.2
    component_type: Agent
    id: 3b7f7d68-7b4e-4a2b-9a7b-2d0b5f12c001
    name: openai-echo-agent
    description: Simple OpenAI-backed assistant that responds concisely.
    system_prompt: >
      You are a helpful assistant. Answer the user briefly and clearly.
    tools:
      - component_type: ServerTool
        name: current_datetime
        description: Returns the current date and time.
        inputs: []
        outputs:
          - title: now
            type: string
    llm_config:
      component_type: OpenAiConfig
      name: openai-gpt-4o-mini
      model_id: gpt-4o-mini
 
llms:
  openai_placeholder:
    _type: openai
    model_name: gpt-4o-mini
    temperature: 0.2

eval:
  general:
    max_concurrency: 2
    output:
      dir: ./.tmp/nat/agent_spec_openai/
      cleanup: false
      job_management:
        append_job_id_to_output_dir: true
    dataset:
      _type: json
      file_path: configs/datasets/agent_spec_openai_samples.json
      structure:
        disable: true
    profiler:
      compute_llm_metrics: true
      token_uniqueness_forecast: true
      workflow_runtime_forecast: true
      csv_exclude_io_text: true
      prompt_caching_prefixes:
        enable: true
        min_frequency: 0.1
      bottleneck_analysis:
        enable_nested_stack: true
      concurrency_spike_analysis:
        enable: true
        spike_threshold: 8
  evaluators: {}
